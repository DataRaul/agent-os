name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate Agent OS
        run: python scripts/validate_agent_os.py
      - name: Test immutable CI action pins
        run: python scripts/test_ci_action_pins.py
      - name: Self-test publication safety gate
        run: python scripts/test_publication_gate.py
      - name: Validate public capability registry
        run: python scripts/validate_capability_registry.py
      - name: Test capability registry hardening
        run: python scripts/test_capability_registry.py
      - name: Test public release readiness
        run: python scripts/test_release_readiness.py
      - name: Validate public release readiness
        run: python scripts/release_readiness.py check
      - name: Validate first stable release candidate
        run: python scripts/validate_release_candidate.py
      - name: Test release candidate guardrails
        run: python scripts/test_release_candidate.py
      - name: Validate published release record
        run: python scripts/validate_release_publication.py
      - name: Test published release record guardrails
        run: python scripts/test_release_publication.py
      - name: Validate stable 1.0.0 release candidate
        run: python scripts/validate_stable_release_candidate.py
      - name: Test stable 1.0.0 release candidate guardrails
        run: python scripts/test_stable_release_candidate.py
      - name: Validate stable v1.0.0 publication record
        run: python scripts/validate_stable_release_publication.py
      - name: Test stable v1.0.0 publication guardrails
        run: python scripts/test_stable_release_publication.py
      - name: Validate generic selection request contract
        run: python scripts/test_capability_selection_contract.py
      - name: Validate pinned capability binding
        run: python scripts/test_capability_selection_binding.py
      - name: Validate declarative decision contracts
        run: python scripts/test_capability_decision_contracts.py
      - name: Validate bounded executable router
        run: python scripts/test_p5_bounded_executable_router.py
      - name: Validate local CSV adapter contract
        run: python scripts/test_query_local_csv_adapter.py
      - name: Validate plugin format reference audit
        run: python scripts/test_openai_plugin_format_reference_audit.py
      - name: Smoke-test specialist reviewer scorer
        run: python scripts/test_specialist_reviewer_eval.py
      - name: Validate blinded specialist reviewer packets
        run: python scripts/test_specialist_reviewer_run_packets.py
      - name: Validate specialist reviewer execution receipts
        run: python scripts/test_specialist_reviewer_execution_receipts.py
      - name: Validate specialist reviewer per-run receipt collection
        run: python scripts/test_specialist_reviewer_run_fragments.py
      - name: Validate specialist reviewer resumable attempt ledger
        run: python scripts/test_specialist_reviewer_attempt_ledger.py
      - name: Validate specialist reviewer execution operations
        run: python scripts/test_specialist_reviewer_execution_ops.py
