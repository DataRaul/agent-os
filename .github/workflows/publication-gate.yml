name: publication-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate immutable CI action pins
        run: python scripts/validate_ci_action_pins.py
      - name: Self-test publication boundary
        run: python scripts/test_publication_gate.py
      - name: Validate public publication boundary
        run: python scripts/validate_publication_gate.py
