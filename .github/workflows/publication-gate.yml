name: publication-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test publication boundary
        run: python scripts/test_publication_gate.py
      - name: Validate public publication boundary
        run: python scripts/validate_publication_gate.py
