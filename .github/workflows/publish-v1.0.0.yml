name: Publish stable v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.0.yml"

permissions:
  contents: write

concurrency:
  group: publish-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.0
      TARGET_SHA: 62fd8466971f4c8055ffefa3606d1cb1e28c7974
    steps:
      - name: Verify exact stable target
        shell: bash
        run: |
          set -euo pipefail

          resolved_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}" --jq '.sha')"
          if [[ "${resolved_sha}" != "${TARGET_SHA}" ]]; then
            echo "::error::Stable release target did not resolve to the authorized commit."
            exit 1
          fi

          encoded_version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${TARGET_SHA}" --jq '.content')"
          version="$(printf '%s' "${encoded_version}" | base64 --decode | tr -d '\r\n')"
          if [[ "${version}" != "1.0.0" ]]; then
            echo "::error::VERSION at target is '${version}', expected '1.0.0'."
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; refusing duplicate publication."
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists without the expected release."
            exit 1
          fi

      - name: Publish stable release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}"             --repo "${GITHUB_REPOSITORY}"             --target "${TARGET_SHA}"             --title "Agent OS v1.0.0"             --generate-notes

      - name: Verify stable publication
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
          release_name="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')"
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')"
          prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"

          if [[ "${release_tag}" != "${TAG}" ]]; then
            echo "::error::Published release tag mismatch."
            exit 1
          fi
          if [[ "${release_name}" != "Agent OS v1.0.0" ]]; then
            echo "::error::Published release name mismatch."
            exit 1
          fi
          if [[ "${draft}" != "false" ]]; then
            echo "::error::Stable release is unexpectedly a draft."
            exit 1
          fi
          if [[ "${prerelease}" != "false" ]]; then
            echo "::error::Stable release is unexpectedly marked prerelease."
            exit 1
          fi
          if [[ "${tag_sha}" != "${TARGET_SHA}" ]]; then
            echo "::error::Tag points to ${tag_sha}, expected ${TARGET_SHA}."
            exit 1
          fi

          echo "Published stable ${TAG} at exact authorized commit ${TARGET_SHA}."
